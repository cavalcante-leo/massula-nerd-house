$kind: http-request
url: "{{baseUrl}}/jogo/desativar/{{jogoId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Desativar jogo retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
