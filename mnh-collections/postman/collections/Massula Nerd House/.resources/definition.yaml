$kind: collection
name: Massula Nerd House
description: |-
  Coleção de endpoints do backend da Massula Nerd House (Node.js + Express + Sequelize + PostgreSQL).

  Antes de executar:
  1. Suba o backend (npm run dev) e o Postgres (container Docker).
  2. Crie o primeiro usuário superadmin diretamente no banco, pois a criação de usuários exige token de superadmin:
     INSERT INTO usuario (nome, nome_usuario, senha_hash, tipo, ativo)
     VALUES ('Administrador', 'admin', '<hash bcrypt da senha>', 'superadmin', true);
     Ex.: hash de 'senha12345' -> use bcrypt (npm i bcrypt) ou https://bcrypt.online
  3. No Postman, execute o request "Login" para obter o token (salvo automaticamente na variável "token").

  As variáveis jogadorId, jogoId e partidaId são preenchidas automaticamente pelos testes dos requests de criação.
variables:
  baseUrl: http://localhost:3000/api
  token: ""
  jogadorId: "1"
  jogoId: "1"
  partidaId: "1"
