$kind: http-request
url: "{{baseUrl}}/presenca/listar"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Listar presenças retorna 200 e array', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 2000
