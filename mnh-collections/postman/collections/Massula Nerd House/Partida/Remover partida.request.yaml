$kind: http-request
url: "{{baseUrl}}/partida/remover/{{partidaId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Remover partida retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 6000
