$kind: http-request
url: "{{baseUrl}}/jogo/listar/{{jogoId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Obter jogo retorna 200 com total_partidas', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.have.property('total_partidas');
      });
    language: text/javascript
order: 3000
