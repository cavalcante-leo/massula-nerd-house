$kind: http-request
url: "{{baseUrl}}/jogo/atualizar/{{jogoId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "descricao": "Jogo de trilhos (descrição atualizada)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Atualizar jogo retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
