$kind: http-request
url: "{{baseUrl}}/partida/{{partidaId}}/jogador/{{jogadorId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Remover jogador da partida retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
