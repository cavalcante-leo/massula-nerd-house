$kind: http-request
url: "{{baseUrl}}/partida/registrar"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_jogo": "{{jogoId}}",
      "nivel": 2,
      "jogada_em": "2026-08-12T20:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Criar partida retorna 201 com id_nivel_jogo', function () {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.id_nivel_jogo).to.be.a('number');
        pm.collectionVariables.set('partidaId', body.id);
      });
    language: text/javascript
order: 1000
