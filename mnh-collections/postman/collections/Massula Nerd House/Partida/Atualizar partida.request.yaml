$kind: http-request
url: "{{baseUrl}}/partida/atualizar/{{partidaId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "jogada_em": "2026-08-12T21:30:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Atualizar partida retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
