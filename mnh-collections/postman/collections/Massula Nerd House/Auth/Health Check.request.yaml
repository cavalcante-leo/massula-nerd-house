$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Health retorna status ok', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().status).to.eql('ok');
      });
    language: text/javascript
order: 2000
