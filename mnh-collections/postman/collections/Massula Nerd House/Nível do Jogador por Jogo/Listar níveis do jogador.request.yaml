$kind: http-request
url: "{{baseUrl}}/jogador-nivel/jogador/{{jogadorId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Listar níveis do jogador retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
