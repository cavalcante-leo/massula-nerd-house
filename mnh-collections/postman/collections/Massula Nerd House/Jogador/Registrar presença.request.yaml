$kind: http-request
url: "{{baseUrl}}/jogador/registrarPresenca/{{jogadorId}}"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "data": "12/08/2026"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Registrar presença retorna 200', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().jogador.presencas_total).to.be.at.least(1);
      });
    language: text/javascript
order: 5000
