$kind: http-request
url: "{{baseUrl}}/usuario/listar/{{usuarioId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Obter usuário retorna 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
