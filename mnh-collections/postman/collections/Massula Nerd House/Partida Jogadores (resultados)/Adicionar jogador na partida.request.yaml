$kind: http-request
url: "{{baseUrl}}/partida/{{partidaId}}/jogador/{{jogadorId}}"
method: POST
headers:
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "posicao_final": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Adicionar jogador retorna 201 com vencedor', function () {
        pm.response.to.have.status(201);
        const body = pm.response.json();
        pm.expect(body.vencedor).to.eql(true);
      });
    language: text/javascript
order: 1000
